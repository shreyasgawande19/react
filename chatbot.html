<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .btn-primary {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
            border: 1px solid #007bff;
        }

        .form-control {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            width: 300px;
            border-width: 1px;
            font-size: 16px;

            flex-grow: 1;
        }

        .chat-input {
            display: flex;
            align-items: center;
            margin-bottom: 60px;

        }

        .chat-container {
            width: 600px;
            margin: 0 auto;
            border-radius: 5px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .user-message {
            justify-content: flex-end;
            display: flex;
            align-items: start;
        }

        .chatbot-message {
            justify-content: flex-start;
            display: flex;
            align-items: start;
        }

        .message-content {
            max-width: 70%;
            padding: 10px;
            border-radius: 5px;
            background-color: #e0e0e0;
            margin: 10px;
            max-width: 300px;
            font-family: Arial, sans-serif;
        }

        .message-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin: 10px;
        }

        .chat-messages {
            flex-grow: 1;
            margin-top: 20px;
            overflow-y: auto;
            scrollbar-width: thin;
        }
    </style>
</head>

<body>
    <div class="container"></div>
    <script src="https://unpkg.com/supersimpledev@8.6.4/react.js"></script>
    <script src="https://unpkg.com/supersimpledev@8.6.4/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev@8.6.4/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev@8.6.4/babel.js"></script>
    <script type="text/babel">
        function ChatInput({ chatMessages, setChatMessages }) {
            const [inputText, setInputText] = React.useState("");

            function saveInputText(event) {
                setInputText(event.target.value);
            }

            function sendMessage() {
                const newChatMessages = [
                    ...chatMessages,
                    {
                        message: inputText,
                        sender: "user",
                        id: crypto.randomUUID()
                    }
                ];

                setChatMessages(newChatMessages);

                const response = chatbot.getResponse(inputText);
                setChatMessages([
                    ...newChatMessages,
                    {
                        message: response,
                        sender: "chatbot",
                        id: crypto.randomUUID()
                    }
                ]);

                setInputText("");
            }
            return (

                <div class="chat-input">
                    <input
                        type="text" placeholder="Send a message to Chatbot"
                        size="30"
                        class="form-control"
                        onChange={saveInputText}
                        value={inputText}
                    />
                    <button onClick={sendMessage}
                        class="btn-primary">Send</button>
                </div>
            )
        }

        function ChatMessage({ message, sender }) {
            // const message = props.message;
            // const sender = props.sender;
            // const {message,sender}= props;
            /*
            if (sender === 'chatbot') {
                return (
                    <div>
                        <img src="images/chatbotimg.png" alt="Chatbot Icon" width="50" height="50" />
                        {message}
                    </div>
                );
            }
            */
            return (
                <div class=
                    {sender === 'chatbot'
                        ? 'chatbot-message' : 'user-message'
                    }>
                    {sender === 'chatbot' && (
                        <img src="images/chatbotimg.png" alt="Chatbot Icon" class="message-icon" />
                    )}
                    <div class="message-content">
                        {message}
                    </div>
                    {sender === 'user' && (
                        <img src="images/userimg.png" alt="User Icon" class="message-icon" />
                    )}
                </div>
            );
        }


        function ChatMessages({ chatMessages }) {
            const chatMessagesEndRef = React.useRef(null);
            React.useEffect(() => {
                const container = chatMessagesEndRef.current;
                if (container) {
                    container.scrollTop = container.scrollHeight;
                }
            }, [chatMessages]);

            return (
                <div class="chat-messages" ref={chatMessagesEndRef}>
                    {chatMessages.map((chatMessage) => {
                        return (
                            <ChatMessage
                                message={chatMessage.message}
                                sender={chatMessage.sender}
                                key={chatMessage.id}
                            />
                        );
                    })}
                </div>
            );
        }
        function App() {

            const [chatMessages, setChatMessages] = React.useState([]);

            // const [chatMessages, setChatMessages] = array;
            // const chatMessages = array[0];
            // const setChatMessages = array[1];
            return (
                <div class="chat-container">

                    <ChatMessages
                        chatMessages={chatMessages}
                    />
                    <ChatInput
                        chatMessages={chatMessages}
                        setChatMessages={setChatMessages}
                    />
                </div>
            )
        }

        const root = document.querySelector(".container");
        ReactDOM.createRoot(root).render(<App />);
    </script>
</body>

</html>
