<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Basics</title>
</head>

<body>
    <div class="container"></div>
    <script src="https://unpkg.com/supersimpledev@8.6.4/react.js"></script>
    <script src="https://unpkg.com/supersimpledev@8.6.4/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev@8.6.4/babel.js"></script>
    <script type="text/babel">
        const { useState } = React;
        function LoginForm() {
            const [username, setusername] = useState('');
            const [password, setpassword] = useState('');
            const [isLogin, setIsLogin] = useState(false);

            const handleLogin = () => {
                if (username && password) {
                    setIsLogin(true);
                }
            };
            return (
                <div>
                    {isLogin ?
                        (
                            <p>Welcome here {username}! </p>
                        ) :
                        (
                            <div>
                                <input type="text" placeholder="Username" value={username} onChange={(e) => setusername(e.target.value)} />
                                <input type="password" placeholder="Password" value={password} onChange={(e) => setpassword(e.target.value)} />
                                <button onClick={handleLogin}>Login</button>
                            </div>
                        )}
                </div>
            );
        };
        function App() {
            return (
                <LoginForm />
            );
        };
        const root = document.querySelector(".container");
        ReactDOM.createRoot(root).render(<App />);
    </script>
</body>

</html>
